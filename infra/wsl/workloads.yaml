apiVersion: v1
kind: Namespace
metadata:
  name: ministation-workloads
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ministation-quota
  namespace: ministation-workloads
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "30"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ministation-validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-check
  namespace: ministation-validation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: placement-check
  template:
    metadata:
      labels:
        app: placement-check
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: placement-check
              topologyKey: kubernetes.io/hostname
      containers:
        - name: http
          image: busybox:1.37.0
          command: [sh, -c]
          args: ['mkdir -p /tmp/www; hostname > /tmp/www/index.html; exec httpd -f -p 8080 -h /tmp/www']
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: placement-check
  namespace: ministation-validation
spec:
  selector:
    app: placement-check
  ports:
    - port: 8080
      targetPort: 8080
