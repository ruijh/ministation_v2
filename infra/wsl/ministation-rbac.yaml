apiVersion: v1
kind: ServiceAccount
metadata:
  name: ministation-controller
  namespace: ministation-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ministation-controller
  namespace: ministation-workloads
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, persistentvolumeclaims, events]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, statefulsets/scale, replicasets]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ministation-controller
  namespace: ministation-workloads
subjects:
  - kind: ServiceAccount
    name: ministation-controller
    namespace: ministation-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ministation-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ministation-test-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ministation-test-nodes
subjects:
  - kind: ServiceAccount
    name: ministation-controller
    namespace: ministation-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ministation-test-nodes
